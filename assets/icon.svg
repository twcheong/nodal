<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow -->
  <rect width="1024" height="1024" rx="230" ry="230"
        fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.15"/>

  <!-- T vertical stem -->
  <rect x="464" y="268" width="96" height="488" rx="12" fill="url(#tGrad)"/>

  <!-- T horizontal bar (on top) -->
  <rect x="192" y="268" width="640" height="96" rx="12" fill="url(#tGrad)"/>

  <!-- Dot accent top-right of T bar -->
  <circle cx="794" cy="232" r="22" fill="url(#dotGrad)" opacity="0.9"/>
</svg>
