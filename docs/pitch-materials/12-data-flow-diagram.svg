<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="1280" height="720" fill="#0f0f0f"/>

  <text x="60" y="64" fill="#7c6aff" font-size="15" letter-spacing="3" font-weight="600">SECURITY &amp; PRIVACY</text>
  <text x="60" y="104" fill="#e8e8e8" font-size="34" font-weight="600">Where your data lives, and what leaves your computer</text>

  <!-- Local machine boundary -->
  <rect x="60" y="150" width="560" height="420" rx="14" fill="#171717" stroke="#4ade80" stroke-width="1.5"/>
  <text x="90" y="190" fill="#4ade80" font-size="17" font-weight="700">YOUR COMPUTER — everything runs locally</text>

  <!-- Twixy app -->
  <rect x="90" y="216" width="500" height="96" rx="10" fill="#1e1e1e" stroke="#7c6aff" stroke-width="1.5"/>
  <text x="110" y="250" fill="#e8e8e8" font-size="18" font-weight="600">Twixy desktop app</text>
  <text x="110" y="276" fill="#888" font-size="14">builds &amp; runs workflows · dashboard · execution logs</text>
  <text x="110" y="297" fill="#888" font-size="14">no remote server operates your accounts</text>

  <!-- Chrome -->
  <rect x="90" y="336" width="240" height="104" rx="10" fill="#1e1e1e" stroke="#2a2a2a"/>
  <text x="110" y="368" fill="#e8e8e8" font-size="16" font-weight="600">Chrome</text>
  <text x="110" y="392" fill="#888" font-size="13">dedicated profile, this machine</text>
  <text x="110" y="412" fill="#4ade80" font-size="13">logins &amp; passwords stay here —</text>
  <text x="110" y="430" fill="#4ade80" font-size="13">never collected or uploaded</text>

  <!-- Workspace -->
  <rect x="350" y="336" width="240" height="104" rx="10" fill="#1e1e1e" stroke="#2a2a2a"/>
  <text x="370" y="368" fill="#e8e8e8" font-size="16" font-weight="600">Workspace folder</text>
  <text x="370" y="392" fill="#888" font-size="13">workflow outputs saved as local files</text>
  <text x="370" y="412" fill="#4ade80" font-size="13">writes restricted to this folder —</text>
  <text x="370" y="430" fill="#4ade80" font-size="13">nothing else on your disk is touched</text>

  <!-- internal arrows -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <line x1="210" y1="312" x2="210" y2="336"/>
    <line x1="470" y1="312" x2="470" y2="336"/>
  </g>

  <!-- Local stays note -->
  <rect x="90" y="464" width="500" height="80" rx="10" fill="#0f0f0f" stroke="#2a2a2a"/>
  <text x="110" y="496" fill="#e8e8e8" font-size="15" font-weight="600">Stays on your machine:</text>
  <text x="110" y="522" fill="#888" font-size="14">passwords · client files · workflow outputs · browsing session</text>

  <!-- External services column -->
  <g font-size="14">
    <!-- AI provider -->
    <rect x="800" y="166" width="420" height="92" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="824" y="198" fill="#e8e8e8" font-size="16" font-weight="600">AI model provider (e.g. Anthropic)</text>
    <text x="824" y="222" fill="#888">receives: text of the workflow step being processed</text>
    <text x="824" y="243" fill="#555" font-size="13">business API terms · not used to train models</text>

    <!-- Search -->
    <rect x="800" y="278" width="420" height="80" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="824" y="310" fill="#e8e8e8" font-size="16" font-weight="600">Twixy web-search service</text>
    <text x="824" y="334" fill="#888">receives: search queries from workflow steps</text>

    <!-- Cloud -->
    <rect x="800" y="378" width="420" height="92" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="824" y="410" fill="#e8e8e8" font-size="16" font-weight="600">Twixy cloud (accounts &amp; team)</text>
    <text x="824" y="434" fill="#888">receives: login, team membership, shared-workflow</text>
    <text x="824" y="454" fill="#888">metadata, usage credits — not your client files</text>

    <!-- Websites -->
    <rect x="800" y="490" width="420" height="80" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="824" y="522" fill="#e8e8e8" font-size="16" font-weight="600">Public websites you research</text>
    <text x="824" y="546" fill="#888">visited via your own Chrome, like a person browsing</text>
  </g>

  <!-- arrows local -> external -->
  <g stroke="#7c6aff" stroke-width="2" fill="none">
    <path d="M 620 264 C 700 250 740 230 800 212"/>
    <path d="M 620 280 C 700 290 740 305 800 316"/>
    <path d="M 620 296 C 700 340 740 390 800 420"/>
    <path d="M 330 440 C 400 560 700 555 800 532"/>
  </g>
  <g fill="#7c6aff" font-size="12">
    <text x="702" y="220">step text only</text>
    <text x="702" y="290">queries</text>
    <text x="640" y="404">account / team</text>
    <text x="560" y="592">browsing (local Chrome)</text>
  </g>

  <!-- Footer -->
  <rect x="60" y="628" width="1160" height="56" rx="10" fill="#1e1e1e" stroke="#2a2a2a"/>
  <text x="640" y="662" fill="#e8e8e8" font-size="15" text-anchor="middle">Every workflow run is recorded — actions, results, errors, timestamps — so you can always answer: <tspan fill="#7c6aff" font-weight="600">what did the AI actually do?</tspan></text>
</svg>
