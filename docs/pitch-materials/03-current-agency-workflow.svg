<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="1280" height="720" fill="#0f0f0f"/>

  <text x="60" y="64" fill="#7c6aff" font-size="15" letter-spacing="3" font-weight="600">THE PROBLEM</text>
  <text x="60" y="104" fill="#e8e8e8" font-size="34" font-weight="600">How agency work runs today — fragmented, manual, founder-dependent</text>

  <!-- Stage boxes -->
  <g font-size="17">
    <!-- Stage 1 -->
    <rect x="60" y="170" width="200" height="150" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="160" y="202" fill="#e8e8e8" font-weight="600" text-anchor="middle">Client request</text>
    <text x="160" y="234" fill="#888" font-size="14" text-anchor="middle">Email · Slack</text>
    <text x="160" y="256" fill="#888" font-size="14" text-anchor="middle">WhatsApp · meetings</text>
    <text x="160" y="292" fill="#555" font-size="13" text-anchor="middle">scattered requirements</text>

    <!-- Stage 2 -->
    <rect x="310" y="170" width="200" height="150" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="410" y="202" fill="#e8e8e8" font-weight="600" text-anchor="middle">Research</text>
    <text x="410" y="234" fill="#888" font-size="14" text-anchor="middle">Google · social tabs</text>
    <text x="410" y="256" fill="#888" font-size="14" text-anchor="middle">ChatGPT / Claude</text>
    <text x="410" y="292" fill="#555" font-size="13" text-anchor="middle">re-done per client</text>

    <!-- Stage 3 -->
    <rect x="560" y="170" width="200" height="150" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="660" y="202" fill="#e8e8e8" font-weight="600" text-anchor="middle">Planning &amp; drafts</text>
    <text x="660" y="234" fill="#888" font-size="14" text-anchor="middle">Spreadsheets · Notion</text>
    <text x="660" y="256" fill="#888" font-size="14" text-anchor="middle">AI chat, personal prompts</text>
    <text x="660" y="292" fill="#555" font-size="13" text-anchor="middle">quality varies by person</text>

    <!-- Stage 4 -->
    <rect x="810" y="170" width="200" height="150" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="910" y="202" fill="#e8e8e8" font-weight="600" text-anchor="middle">Monitoring</text>
    <text x="910" y="234" fill="#888" font-size="14" text-anchor="middle">Platform dashboards</text>
    <text x="910" y="256" fill="#888" font-size="14" text-anchor="middle">manual checks</text>
    <text x="910" y="292" fill="#555" font-size="13" text-anchor="middle">inconsistent</text>

    <!-- Stage 5 -->
    <rect x="1060" y="170" width="160" height="150" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="1140" y="202" fill="#e8e8e8" font-weight="600" text-anchor="middle">Reporting</text>
    <text x="1140" y="234" fill="#888" font-size="14" text-anchor="middle">Exports · slides</text>
    <text x="1140" y="256" fill="#888" font-size="14" text-anchor="middle">spreadsheets</text>
    <text x="1140" y="292" fill="#555" font-size="13" text-anchor="middle">assembled by hand</text>
  </g>

  <!-- copy-paste connectors -->
  <g stroke="#f87171" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="260" y1="245" x2="310" y2="245"/>
    <line x1="510" y1="245" x2="560" y2="245"/>
    <line x1="760" y1="245" x2="810" y2="245"/>
    <line x1="1010" y1="245" x2="1060" y2="245"/>
  </g>
  <g fill="#f87171" font-size="12" text-anchor="middle">
    <text x="285" y="232">copy</text><text x="285" y="266">paste</text>
    <text x="535" y="232">copy</text><text x="535" y="266">paste</text>
    <text x="785" y="232">copy</text><text x="785" y="266">paste</text>
    <text x="1035" y="232">copy</text><text x="1035" y="266">paste</text>
  </g>

  <!-- Founder hub -->
  <rect x="440" y="430" width="400" height="110" rx="10" fill="#1e1e1e" stroke="#f87171" stroke-width="1.5"/>
  <text x="640" y="472" fill="#e8e8e8" font-size="20" font-weight="600" text-anchor="middle">The founder</text>
  <text x="640" y="500" fill="#888" font-size="15" text-anchor="middle">reviews everything · chases status updates</text>
  <text x="640" y="522" fill="#888" font-size="15" text-anchor="middle">holds the process in their head</text>

  <!-- arrows founder -> stages -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <path d="M 500 430 C 380 390 220 370 160 320"/>
    <path d="M 560 430 C 480 390 430 370 410 320"/>
    <path d="M 640 430 L 660 320"/>
    <path d="M 720 430 C 800 390 870 370 910 320"/>
    <path d="M 780 430 C 920 390 1080 370 1140 320"/>
  </g>
  <text x="640" y="392" fill="#555" font-size="13" text-anchor="middle">manual review &amp; status checking, every stage</text>

  <!-- Bottom callouts -->
  <g font-size="16">
    <rect x="60" y="590" width="360" height="80" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="80" y="624" fill="#f87171" font-weight="600">5–10 hrs / week / person</text>
    <text x="80" y="650" fill="#888" font-size="14">lost to repetitive browser work</text>

    <rect x="460" y="590" width="360" height="80" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="480" y="624" fill="#f87171" font-weight="600">Best processes live in one head</text>
    <text x="480" y="650" fill="#888" font-size="14">and leave when that person leaves</text>

    <rect x="860" y="590" width="360" height="80" rx="10" fill="#171717" stroke="#2a2a2a"/>
    <text x="880" y="624" fill="#f87171" font-weight="600">More clients = more founder hours</text>
    <text x="880" y="650" fill="#888" font-size="14">growth is capped by review capacity</text>
  </g>
</svg>
