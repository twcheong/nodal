<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css">
<style>body{background:var(--bg-base);padding:20px 24px}</style></head>
<body>
<div style="max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px">
  <div class="bubble user" style="align-self:flex-end">이번 달 경쟁사 콘텐츠 조사 돌려줘</div>
  <div class="bubble ai" style="align-self:flex-start">저장된 워크플로가 있습니다. 아래 값으로 실행할까요?</div>
  <div style="border:1px solid var(--accent);border-radius:var(--radius-md);padding:10px 12px;background:var(--bg-surface)">
    <div style="font-size:12px;font-weight:600;color:var(--text-primary)">▶ Ready to run: 월간 경쟁사 콘텐츠 조사</div>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:11px;font-family:var(--font-mono);color:var(--text-secondary)">
      <div><span style="color:var(--text-muted)">client</span> · 메이플앤코</div>
      <div><span style="color:var(--text-muted)">competitors</span> · 카페온도, 빈브라더스, 커피문</div>
      <div><span style="color:var(--text-muted)">month</span> · 2026-08</div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button style="background:var(--accent);border:none;color:#fff;border-radius:var(--radius-sm);padding:6px 14px;font-size:12px;font-weight:600">▶ Run</button>
      <button style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:var(--radius-sm);padding:6px 14px;font-size:12px">Cancel</button>
      <span style="font-size:11px;color:var(--text-muted)">…or reply in chat to change these values.</span>
    </div>
  </div>
</div>
</body></html>
