# nodal monorepo root — 워크스페이스 앵커. 배포되지 않는다.
#
# ⚠️ license 필드는 의도적으로 비어 있다. docs/license.md 참조.
#    M3 전에 소유자가 결정하기 전까지 어떤 라이선스도 명시하지 않는다.

[project]
name = "nodal-workspace"
version = "0.0.0"
description = "nodal monorepo root (not published)"
requires-python = ">=3.11"
dependencies = [
    "nodal-core",
    "nodal-nodes-core",
    "nodal-server",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nodal-core = { workspace = true }
nodal-nodes-core = { workspace = true }
nodal-server = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "jsonschema>=4.26.0",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/core/src", "packages/server/src", "packages/nodes-core/src"]
# ruff 0.16+ 는 마크다운 안의 python 코드 블록도 포맷한다. docs/ 는 스펙 문서이므로
# 손대지 않는다 — 문서의 정렬은 의도된 것이고, 예제 코드는 실행 대상이 아니다.
extend-exclude = ["docs/**", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "F403", # star import 금지 — 아래 주석 참조. "F" 에 포함되지만 명시해 둔다
    "F405", # star import 에서 온 이름 사용 금지
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations — 타입 힌트 필수 (AGENTS.md 코딩 컨벤션)
    "TID",  # flake8-tidy-imports
    "RUF",
]

# F403/F405 를 따로 적어 두는 이유:
#
# `nodal.Any` 는 design.md §4.3 이 규정한 1급 와일드카드 타입이라 이름을 유지한다.
# 이 이름이 실제로 위험해지는 경우는 하나뿐이다 — 노드 저자가 `from nodal import *`
# 를 하면 `typing.Any` 가 조용히 가려진다. star import 를 막으면 그 경우가 사라진다.
#
# 지금은 "F" 가 이미 둘 다 잡지만, 나중에 select 를 좁힐 때 함께 사라지면 방어가
# 조용히 없어진다. 그래서 이 두 코드는 이름으로 남겨 둔다.
# per-file-ignores 어디에서도 이 둘을 면제하지 말 것 — 특히 노드 패키지에서.
ignore = [
    "ANN401",  # Any 허용 — 그래프 리터럴은 본질적으로 Any다
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"tools/*" = ["ANN"]
# 노드 팩의 `returns = {"image": Image}` 는 공유 가변 상태가 아니라 **선언**이다
# (design.md §4.2). RUF012 를 켜 두면 노드 저자가 전부 ClassVar 로 감싸야 하고,
# "선언형 + 중복 선언 없음"이라는 노드 SDK 의 요점이 사라진다.
"packages/nodes-*/**" = ["RUF012"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 의존성 규칙 강제 (AGENTS.md 아키텍처 절). core는 torch를 모른다.
"torch".msg = "packages/core 와 packages/server 는 torch 를 import 하지 않는다. torch 는 packages/nodes-diffusion 전용."

[tool.ruff.lint.isort]
known-first-party = ["nodal", "nodal_server", "nodal_nodes_core"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
# packages/core/tests 는 M1 에서 다른 에이전트가 소유한다.
# packages/server/tests 는 M2 API 계약 검사다.
testpaths = ["packages/core/tests", "packages/server/tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "packages/core/src:packages/server/src:packages/nodes-core/src"
packages = ["nodal", "nodal_server", "nodal_nodes_core"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
