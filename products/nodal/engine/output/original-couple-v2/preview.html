<!doctype html>
<html lang="ko">

    <title>수정 투샷 — 영상 시안</title>
    <style>
      * {
        box-sizing: border-box;

      body {
        margin: 0;

        font-family: "Malgun Gothic", sans-serif;
      }
      main {

      h1 {
        font-size: 32px;

        width: 100%;

        aspect-ratio: 16 / 9;

      <video controls playsinline preload="metadata" poster="01-corrected-wide.png">

      </video>
      <div class="facts">
        <p>약 5.17초 · 24fps · 자막 없음</p>

      <h2>기준 이미지</h2>
      <img
        src="01-corrected-wide.png"

      />
