[project]
name = "nodal-server"
version = "0.0.0"
description = "nodal — FastAPI 서버 (REST + WebSocket)"
license = "Apache-2.0"
# 휠의 `.dist-info/licenses/` 에 실제 파일을 넣는다 — 근거는 packages/core/pyproject.toml.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "nodal-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.32",
    # MCP 표면 (design.md §12). 브리지를 두지 않으므로 SDK 는 **서버 안에** 있다 —
    # 별도 프로세스면 스키마·타입·에러를 두 번 표현하게 된다 (§12.1 · §12.9).
    # 라이선스: MIT (modelcontextprotocol/python-sdk). AGENTS.md 기술 스택이
    # 요구하는 허용적 라이선스이고, CI 의 licence-guard 가 GPL 표기를 거부한다.
    "mcp>=2.0",
    # `mcp_server.py` 가 `mcp_types`(`Tool`·`ListToolsResult` 등)를 직접 import 한다.
    # `mcp` 의 전이 의존이라 지금까지는 선언 없이도 설치돼 있었지만, 직접 import 하는
    # 배포판은 선언한다 — 그래야 `mcp` 가 언젠가 이 의존을 내리면 여기서 먼저 깨진다.
    "mcp-types>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodal_server"]

[tool.uv.sources]
nodal-core = { workspace = true }
