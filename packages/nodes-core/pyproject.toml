[project]
name = "nodal-nodes-core"
version = "0.0.0"
description = "nodal — 기본 노드 팩 (유틸 · 수학 · 문자열 · 파일)"
requires-python = ">=3.11"
dependencies = [
    "nodal-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodal_nodes_core"]

[tool.uv.sources]
nodal-core = { workspace = true }
