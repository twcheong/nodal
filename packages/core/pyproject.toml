[project]
name = "nodal-core"
version = "0.0.0"
description = "nodal — 도메인 중립 그래프 엔진 (torch 의존 없음)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodal"]
