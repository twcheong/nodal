[project]
name = "nodal-nodes-image"
version = "0.0.0"
description = "nodal — 이미지 노드 팩 (Load · Save · Resize · Crop · Blend · Mask · Composite)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "nodal-core",
    # numpy 와 Pillow 는 **이 패키지에만** 있다. core 는 도메인 중립 그래프 엔진이라
    # 런타임 이미지 표현을 모른다 (AGENTS.md 아키텍처 절, design.md §4.4).
    "numpy>=2.1",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodal_nodes_image"]

[tool.uv.sources]
nodal-core = { workspace = true }
