[project]
name = "nodal-server"
version = "0.0.0"
description = "nodal — FastAPI 서버 (REST + WebSocket)"
license = "Apache-2.0"
# 휠의 `.dist-info/licenses/` 에 실제 파일을 넣는다 — 근거는 packages/core/pyproject.toml.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "nodal-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodal_server"]

[tool.uv.sources]
nodal-core = { workspace = true }
