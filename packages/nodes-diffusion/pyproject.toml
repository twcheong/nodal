[project]
name = "nodal-nodes-diffusion"
version = "0.0.0"
description = "nodal — diffusion 노드 팩 (LoadCheckpoint · CLIPTextEncode · KSampler · VAEDecode)"
license = "Apache-2.0"
# 휠의 `.dist-info/licenses/` 에 실제 파일을 넣는다 — 근거는 packages/core/pyproject.toml.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# **의존성이 `nodal-core` 하나뿐인 것은 실수가 아니다.**
#
# 이 팩은 **노드 스키마를 노출하기 위해 언제나 설치된다** (루트 dependencies).
# 그래야 `uv sync` 만 한 사람의 `/api/nodes` 에도 시드 위젯이 나오고, 프론트
# 담당이 torch 없이 작업을 시작할 수 있다.
#
# 스키마 노출에 필요한 것은 `nodal` 의 타입뿐이다 — diffusers 도 torch 도 필요
# 없다. 그래서 무거운 것은 전부 `runtime` extra 로 내렸고, 모듈 최상단에서는
# 절대 import 하지 않는다. `run` 본문에서 늦게 import 한다.
#
# 결과: `uv sync` = 스키마는 보이고 실행하면 명확히 실패 /
#       `uv sync --group diffusion` = 실제로 돈다.
dependencies = [
    "nodal-core",
]

[project.optional-dependencies]
# 실제로 실행할 때 필요한 것들. 루트의 `diffusion` 그룹과 `cuda` 엑스트라가
# `nodal-nodes-diffusion[runtime]` 로 이것을 켠다.
#
# torch 와 accelerate 는 **여기에도 없다** — 둘은 어느 인덱스에서 받을지가
# 설치하는 사람의 하드웨어에 달려서 루트가 정한다. 이유는 아래 주석.
runtime = [
    # diffusers 에 모델 계층을 위임한다. 직접 구현하지 않는다 (design.md §9).
    "diffusers>=0.35",
    "transformers>=4.46",
    "safetensors>=0.4",
    # LoRA 어댑터. diffusers 의 load_lora_weights 가 이것을 요구한다.
    "peft>=0.14",
    # 상한 <2.5 는 nodes-image 와 같은 이유(mypy 스텁 파싱)이고 같은 값이어야
    # 한다 — 워크스페이스는 락파일 하나를 공유하므로 두 하한/상한이 갈라지면
    # 해석이 실패한다.
    "numpy>=2.1,<2.5",
    # 잠재 썸네일 PNG 인코딩 (latent.py). nodes-image 를 부르지 않는 이유는
    # 노드 팩끼리 서로를 몰라야 하기 때문이다 (AGENTS.md 아키텍처 절).
    "pillow>=11.0",
]

# **torch 와 accelerate 가 여기 없는 것은 실수가 아니다.**
#
# torch 휠은 CPU 빌드와 CUDA 빌드가 같은 이름·같은 버전으로 서로 다른 인덱스에
# 있다. 어느 쪽을 받을지는 패키지 메타데이터가 아니라 **설치하는 사람의 하드웨어**
# 가 정하는 문제라서, 루트 워크스페이스의 `[tool.uv.sources]` 가 결정한다
# (`uv sync --group diffusion` = CPU, `uv sync --extra cuda` = CUDA).
#
# 여기에 `torch` 를 평범한 의존성으로 적으면 그룹도 엑스트라도 켜지 않은 해석
# 분기가 **PyPI 기본 인덱스로 떨어져 CUDA 휠을 끌고 온다.** 실제로 락파일에
# `torch <- pypi.org/simple` 항목이 생기는 것을 확인했다. 그 문을 닫으려면
# 여기에 적지 않는 수밖에 없다.
#
# `accelerate` 도 같은 이유로 여기 없다 — **`torch>=2.0.0` 을 마커 없이 하드
# 의존성으로 건다.** 한 단계 건너 같은 누출이 생긴다. `diffusers` ·
# `transformers` · `safetensors` 는 torch 를 extra 뒤에만 두므로 여기 남는다.
# (누출은 추측이 아니라 락파일에서 확인하고 고쳤다. 다시 확인하려면:
# `uv lock` 후 uv.lock 에 `name = "torch"` + `pypi.org/simple` 항목이 있는지 본다.)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodal_nodes_diffusion"]

[tool.uv.sources]
nodal-core = { workspace = true }
