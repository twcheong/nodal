name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -m "not diffusion"

      - name: JSON Schema drift 검사
        run: uv run python tools/export_schema.py --check

      # types.json 은 Python/TS 공용 계약이다. Python 쪽 판정을 여기서,
      # TS 쪽 판정을 web 잡의 vitest 가 같은 케이스로 검사한다.
      - name: types.json 검증 (Python 판정)
        run: uv run python tools/check_types.py

      # M2 API 계약. 프론트가 이 산출물에서 타입을 생성하므로 drift 는 곧
      # 프론트 빌드 실패다.
      - name: OpenAPI drift 검사
        run: uv run python tools/export_openapi.py --check

  # diffusion 은 별도 잡이다. 위 잡은 torch 없이 수십 초에 끝나는데 여기에
  # 191.8 MB 설치를 얹으면 lint · typecheck 피드백까지 같이 느려진다.
  # 기본 `uv sync` 에 torch 가 없는 것도 같은 이유다 (root pyproject.toml).
  diffusion:
    name: diffusion (CPU 고정)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # **CPU 를 명시적으로 고정한다.** `--group diffusion` 은 루트
      # pyproject.toml 의 `[tool.uv.sources]` 에 따라 PyTorch CPU 인덱스로
      # 해석된다. `--extra cuda` 는 여기서 절대 쓰지 않는다 — 러너에 GPU 가
      # 없을 뿐 아니라 CUDA 휠 묶음이 수 GB 다.
      - run: uv sync --frozen --group diffusion

      # 실수로 CUDA 가 해석되지 않았는지 결과물로 확인한다. 설정을 믿지 않고
      # 실제로 설치된 것을 본다 — 설정은 나중에 누가 바꿀 수 있다.
      - name: CPU 휠이 맞는지 확인
        run: |
          if uv pip list | grep -qiE '^(nvidia-|cuda-)'; then
            echo "::error::CUDA 패키지가 설치됐다. CI 는 CPU 휠만 써야 한다."
            uv pip list | grep -iE '^(nvidia-|cuda-)'
            exit 1
          fi
          uv run python -c "import torch; print('torch', torch.__version__)"

      - name: mypy (diffusion 노드 팩)
        run: uv run mypy -p nodal_nodes_diffusion

      # 디바이스 분기가 흩어지는 것을 막는다 (M4 계약, design.md §9.3).
      # ruff 의 banned-api 로는 잡히지 않고 grep 으로는 문서의 산문까지 잡힌다 —
      # 근거는 스크립트 자체의 docstring 에 있다.
      - name: 디바이스 경계 (torch.cuda · torch.mps 는 devices.py 에만)
        run: uv run python tools/check_device_boundary.py

      - name: pytest (diffusion)
        run: |
          if [ -d packages/nodes-diffusion/tests ]; then
            NODAL_DEVICE=cpu uv run pytest packages/nodes-diffusion/tests
          else
            echo "아직 테스트가 없다 (M4 계약 단계). 구현 커밋에서 채운다."
          fi

      # M6 완료 기준을 증명하는 서버 템플릿 테스트도 diffusion 런타임이 필요하다.
      # 선택식이 어긋나 0건이 되어도 pytest 는 성공할 수 있으므로 수집 수를 먼저 고정한다.
      - name: pytest (M6 diffusion 템플릿 · 0건 수집 금지)
        run: |
          collected=$(NODAL_DEVICE=cpu uv run pytest --collect-only -q -o addopts= -m diffusion \
            packages/server/tests/test_m62_templates.py | \
            awk '/::/ { count += 1 } END { print count + 0 }')
          if [ "$collected" -eq 0 ]; then
            echo "::error::M6 diffusion 템플릿 테스트가 0건 수집됐다."
            exit 1
          fi
          echo "M6 diffusion 템플릿 테스트 ${collected}건 수집."
          NODAL_DEVICE=cpu uv run pytest -m diffusion \
            packages/server/tests/test_m62_templates.py

  web:
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: prettier
        run: pnpm format:check

      - name: eslint
        run: pnpm -r lint

      - name: tsc
        run: pnpm -r typecheck

      # 생성된 타입이 커밋된 것과 같은지. 백엔드가 스키마를 바꾸고 프론트
      # 타입 재생성을 잊으면 여기서 잡힌다.
      - name: 생성된 API 타입 drift 검사
        run: pnpm --filter @nodal/web gen:api:check

      - name: vitest
        run: pnpm -r test

      - name: build
        run: pnpm -r build

  licence-guard:
    name: 라이선스 가드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 라이선스는 Apache-2.0 으로 확정됐다 (docs/license.md).
      # 예전에는 이 잡이 LICENSE 파일이 *없는지* 확인했다. 이제 반대다 —
      # LICENSE·NOTICE 는 Apache-2.0 §4(a)·§4(d) 가 재배포에 요구하는 파일이라
      # 사라지면 배포물이 라이선스 조건을 만족하지 못한다.
      - name: LICENSE · NOTICE 파일이 있는지 확인
        run: |
          missing=0
          for f in LICENSE NOTICE; do
            if [ ! -f "$f" ]; then
              echo "::error::$f 파일이 없다. Apache-2.0 배포에 필요하다 — docs/license.md 참조."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          if ! grep -q 'Apache License' LICENSE; then
            echo "::error::LICENSE 가 Apache-2.0 전문이 아니다."
            exit 1
          fi
          echo "LICENSE · NOTICE 존재 확인."

      # 각 패키지 안의 사본이 루트와 같은지. hatchling 은 패키지 디렉토리에서만
      # 라이선스 파일을 찾으므로 (docs/license.md), 사본 없이는 휠의
      # `.dist-info/licenses/` 가 비어 §4(a) 를 만족하지 못한다. 사본이 필요하다면
      # 최소한 갈라지지는 않아야 한다 — 기억이 아니라 이 검사가 그것을 보장한다.
      - name: 패키지 안의 LICENSE · NOTICE 사본이 루트와 같은지 확인
        run: |
          drift=0
          for pkg in packages/*/; do
            [ -f "$pkg/pyproject.toml" ] || continue
            for f in LICENSE NOTICE; do
              if ! cmp -s "$f" "$pkg$f"; then
                echo "::error::$pkg$f 가 루트의 $f 와 다르다 (또는 없다). 루트에서 복사하라."
                drift=1
              fi
            done
          done
          [ "$drift" = 0 ] || exit 1
          echo "패키지 라이선스 사본 일치."

      # 라이선스 표기가 SPDX 로 일관되는지. 확정 전의 LicenseRef-UNDECIDED 가
      # 어딘가에 남아 있으면 패키지 메타데이터가 LICENSE 파일과 어긋난다.
      - name: 패키지 메타데이터가 Apache-2.0 인지 확인
        run: |
          if grep -rn 'LicenseRef-UNDECIDED' \
               --include=pyproject.toml --include=package.json . \
               --exclude-dir=node_modules --exclude-dir=.venv ; then
            echo "::error::LicenseRef-UNDECIDED 가 남아 있다. Apache-2.0 으로 확정됐다."
            exit 1
          fi
          echo "패키지 메타데이터 일관."

      # AGENTS.md 기술 스택: GPL/AGPL 의존성을 추가하지 않는다.
      # 확정 이후 이 검사가 더 중요해졌다 — GPL 코드가 들어오면 Apache-2.0 으로
      # 배포할 수 없다. 이제는 "선택지를 지키는" 검사가 아니라 "이미 한 약속을
      # 지키는" 검사다.
      #
      # 시야의 한계 (2026-08-27, M7.2): 이 grep 은 **이 저장소 체크아웃만**
      # 본다. `~/.nodal/extensions` 의 서드파티 확장은 사용자 홈 디렉토리에
      # 있고 이 저장소 밖이라 애초에 스캔 대상이 아니다 — 확장이 GPL 이어도
      # 우리 배포물에 들어오지 않으므로 절대 규칙 1 위반은 아니지만
      # (design.md §8), 이 검사가 "사용자 시스템에 GPL 코드가 없다"를
      # 보장한다는 뜻으로 읽지 않는다.
      - name: GPL 의존성이 없는지 확인
        run: |
          if grep -rniE '"?(GPL-[23]|AGPL-3|GPL-2\.0)' \
               --include=pyproject.toml --include=package.json . \
               --exclude-dir=node_modules --exclude-dir=.venv ; then
            echo "::error::GPL/AGPL 라이선스 표기가 발견됐다. docs/license.md 참조."
            exit 1
          fi
          echo "허용적 라이선스만 사용 중."

  dco:
    name: DCO (Signed-off-by)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 모든 커밋에 Signed-off-by 가 있는지 확인
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::$sha 에 Signed-off-by 가 없다 — git commit -s 를 쓰라."
              missing=1
            fi
          done < <(git rev-list "$base".."$head")
          exit $missing
